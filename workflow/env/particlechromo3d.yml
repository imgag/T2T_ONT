# Conda environment for ParticleChromo3D
# 3D chromatin structure prediction using Particle Swarm Optimization
# GitHub: https://github.com/OluwadareLab/ParticleChromo3D

name: particlechromo3d
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.10
  - numpy=2.2.6
  - scipy=1.15.2
  - matplotlib=3.10.8
  - pandas=2.3.3
  - biopython=1.86
  - pip=25.3
  - pip:
    # ParticleChromo3D from PyPI
    - ParticleChromo3D=1.0.3
