# Conda environment for TADbit
# 3D chromatin structure modeling using IMP (Integrative Modeling Platform)
# GitHub: https://github.com/3DGenomes/TADbit
# Note: TADbit has complex dependencies; singularity container is recommended

name: tadbit
channels:
  - conda-forge
  - salilab
  - bioconda
  - defaults

dependencies:
  - python=3.9
  - numpy>=1.20
  - scipy>=1.7
  - matplotlib>=3.5
  - pandas>=1.3
  - imp>=2.18        # Integrative Modeling Platform
  - mcl             # Markov Clustering
  - pysam>=0.19
  - samtools>=1.15
  - htslib>=1.15
  - pip
  - pip:
    - TADbit
    - pytadbit
