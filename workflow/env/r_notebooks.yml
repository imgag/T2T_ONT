name: r-notebooks
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - pandoc=3.10
  - r-base=4.5.2
  - r-tidyverse=2.0.0
  - r-ggplot2=4.0.3
  - r-argparse=2.3.1
  - r-scales=1.4.0
  - r-proto=1.0.0
  - r-data.table=1.17.8
  - r-viridis=0.6.5
  - r-optparse=1.8.2
  - r-extrafont=0.20
  - r-flextable=0.10.0
  - r-officer=0.7.6
  # R kernel and VSCode integration
  - r-irkernel=1.3.2
  - r-httpgd=2.1.4
  - r-languageserver=0.3.18
  - radian=0.6.15
  - jupyter=1.1.1
  - jupyter_client=8.9.1
  # notebook dependencies
  - r-yaml=2.3.12
  - r-ggridges=0.5.7
  - r-gt=1.3.0
  - r-openxlsx=4.2.8.1
  - r-ggnewscale=0.5.2
  - r-ggpubr=0.6.3
  - r-patchwork=1.3.2
  - r-devtools  # not currently installed in the live env -- version unknown, not guessed
  - r-remotes=2.5.0
  # r-ggideogram is not on conda-forge; install manually after env creation:
  #   Rscript -e 'remotes::install_github("caspargross/ggideogram")'
