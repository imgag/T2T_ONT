# Reference datasets
ref: data/ref/T2T-CHM13.v2.fasta
ref_fai: data/ref/T2T-CHM13.v2.fasta.fai
ref_cdna: data/ref/Homo_sapiens.GRCh38.cdna.all.fa.gz
ref_cdna_paf: data/ref/T2T-CHM13.cdna.paf
ref_giab_vcf: data/ref/CHM13v2.0_HG2-T2TQ100-V1.1.vcf.gz
ref_hg002_q100: data/ref/hg002v1.1.fasta.gz
ref_centromer_bed: data/ref/hg002v1.1.cenSatv2.0.bed
ref_grch37: /mnt/storage2/megSAP/data_hg19/genomes/GRCh37.fa

# DORADO settings
# Version history (based on git history):
# - Current: dorado-1.1.1 (updated in commit 5249fe6f on 2025-11-20)
# - Previous versions can be found in git history before 2025-11-20
# Note: conda environment (workflow/env/dorado.yml) also contains dorado v0.7.2
dorado : bin/dorado-1.1.1-linux-x64/bin/dorado
dorado_model:
  sup: "data/dorado_models/dna_r10.4.1_e8.2_400bps_sup@v5.2.0"
  apk: "data/dorado_models/dna_r10.4.1_e8.2_apk_sup@v5.0.0"
  duplex: "sup"
  mod: "data/dorado_models/dna_r10.4.1_e8.2_400bps_sup@v5.2.0_5mCG_5hmCG@v1"
models_directory: "data/dorado_models"
split_number: 100
process_subset_chunks: 3
seq_kit : "SQK-ULK114"

herro_model : bin/herro-v1

gpu_queues: "gpu_srv010,gpu_srv019"

# Preprocessing settings
min_length :
  default: 10000
  UL: 80000
min_mean_q : 9
genome_length : 3200000000

# Assembly settings
verkko_dryrun : False

# Hifiasm settings:
hifiasm : bin/hifiasm-0.25.0/hifiasm
hifiasm_opts:
  ont:   "--telo-m CCCTTA --dual-scaf --ul-cut 70000 -l1 --ont {ul}"
  herro: "--telo-m CCCTTA --dual-scaf --ul-cut 70000 -l1 {hq}"
  ont_trio: "--telo-m CCCTTA --dual-scaf --ul-cut 70000 -l0 --trio-dual --ont -1 {maternal} -2 {paternal} {ul}"
  herro_trio: "--telo-m CCCTTA --dual-scaf --ul-cut 70000 -l0 --trio-dual -1 {maternal} -2 {paternal} {hq}"
  rfhap: "--telo-m CCCTTA --dual-scaf --primary --ul-cut 70000 -l2 --n-hap 1 --ont {ul}"

yak : bin/yak/yak
mashmap : bin/MashMap/build/bin/mashmap

# Variant calling settings
X_PAR_file: bin/dipcall.kit/hs38.PAR.bed
run-dipcall: bin/dipcall.kit/run-dipcall
hapdiff: bin/hapdiff/hapdiff.py

# meryl kmer choice
K-mer: 37  # For QC
K-mer_phasing: 30 # For Trio phasing

kmer_refs:
  GE-MED-T2T00: "analysis_other/merqury_shortread/DX203429_02.meryl"

# T2T contigs
T2T_chromosomes: bin/T2T_Sequences/T2T_chromosomes.sh

# RepeatMasker
dfam_db: data/ref/dfam39_full.7.h5
dfam_hmm: data/ref/Dfam-curated_only-1.hmm

# GQC
gqc:
  venv: bin/GQC/venv
  config: data/ref/gqc_config.yaml
  resourcedir: data/ref/gqc_resources
  fastk_binfolder: bin/FASTK/bin

# hmm_flagger
bam2cov: "mobinasri/flagger:v1.1.0 bam2cov"
hmm_flagger: "mobinasri/flagger:v1.1.0 hmm_flagger"
hmm_flagger_alpha_tsv: "data/ref/alpha_optimum_trunc_exp_gaussian_w_8000_n_50.ONT_R1041_Dorado_DEC_2024.v1.1.0.tsv"

# Dip3D
falign: bin/Falign/Linux-amd64/bin/falign
dip3d: bin/Falign/Linux-amd64/bin/dip3d
ashic: bin/ASHIC/ashic/__main__.py
ashic_data: bin/ASHIC/ashic/cli/ashic_data.py
ashic_utils: bin/ASHIC/ashic/cli/ashic_utils.py
ashic_model: ASHIC-ZIPM
ashic_resolution: 10000

# Pairtools
parse2_depth: 20

# Juicer Resolutions
juicer_resolutions: "5000,10000,25000,40000,100000,250000,1000000"

# Cooler Resolutions
min_bin_width: 1000
cooler_resolutions: "1000,5000,10000,50000,100000"

# Cooltools
gc_track: "/mnt/storage3b/projects/no_ngsd/ahthapp1_T2T_ONT/sarah/data/gc.100000.tsv"
insulation_resolutions:
  - "25000"
  - "40000"

# FAN-C
regions_fanc:
  - "11_1500000-3500000"
  - "6_144000000-146000000"
  - "14_94000000-96000000"
  - "15_22000000-24000000"
  - "20_59000000-61000000"

# HiCExplorer
correction_method: "ICE"
filter_threshold: "-2.5 5"
correlation_range: "20000:500000"
porec_resolutions:
  - "1000"
  - "5000"
  - "10000"
  - "25000"
  - "40000"

# TAD calling parameters
tad_resolutions: ["25000", "40000"]  # Higher resolution for TADs
tad_min_depth: 20000
tad_max_depth: 200000
tad_step: 10000
tad_fdr_threshold: 0.05
tad_delta: 0.01
tad_correction_threshold: 1.5

# Loop calling parameters
loop_resolutions: ["5000", "10000"]  # Higher resolution for loops
loop_window_size: 10
loop_peak_width: 6
loop_max_distance: 2000000
loop_pvalue_threshold: 0.05
loop_fdr_threshold: 0.1

# Visualization parameters
plot_dpi: 300
aggregate_range: 100000
aggregate_bins: 30

# Insulation resolutions
insulation_resolutions:
  - "25000"
  - "40000"
insu_window_multipliers: [3,5,10,25]


# Population genetics
liftover_chain_GRCh37_to_T2T: data/ref/hg19-chm13v2.chain
min_male_xf: 0.85
max_female_yrate: 0.4
gnomix: "python -u bin/gnomix/gnomix.py"
gnomix_config: analysis_other/ancestry/local/gnomix/gnomix_config.yaml

# Longdust
longdust: bin/longdust/longdust

# Modkit
modkit: bin/dist_modkit_v0.5.1_8fa79e3/modkit
mod_num_reads: 100420

# Longphase
longphase: bin/longphase_linux-x64

# PLotting options

colours:
  superpop: # Colour palette for Superpopulations (5 groups) - lighter shades
    EUR: "#1976D2"  # Lighter blue
    AFR: "#FF6F00"  # Lighter orange
    EAS: "#388E3C"  # Lighter green
    SAS: "#D32F2F"  # Lighter red
    AMR: "#7B1FA2"  # Lighter purple
  pop_palette: # Colour palette for Populations (26 populations from 1000G)
    # European
    CEU: "#1565C0"
    GBR: "#1976D2"
    FIN: "#1E88E5"
    IBS: "#2196F3"
    TSI: "#42A5F5"
    # African
    YRI: "#E64A19"
    LWK: "#F4511E"
    GWD: "#FF5722"
    MSL: "#FF6F00"
    ESN: "#FF8A65"
    ACB: "#FFAB91"
    ASW: "#FFCCBC"
    # East Asian
    CHB: "#2E7D32"
    JPT: "#388E3C"
    CHS: "#43A047"
    CDX: "#4CAF50"
    KHV: "#66BB6A"
    # South Asian
    GIH: "#C62828"
    PJL: "#D32F2F"
    BEB: "#E53935"
    STU: "#F44336"
    ITU: "#EF5350"
    # American
    MXL: "#6A1B9A"
    PUR: "#7B1FA2"
    CLM: "#8E24AA"
    PEL: "#9C27B0"
