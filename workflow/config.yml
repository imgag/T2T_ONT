# DORADO settings
dorado : bin/dorado-1.1.1-linux-x64/bin/dorado
dorado_model:
  sup: "data/dorado_models/dna_r10.4.1_e8.2_400bps_sup@v5.2.0"
  apk: "data/dorado_models/dna_r10.4.1_e8.2_apk_sup@v5.0.0"
  duplex: "sup"
  mod: "data/dorado_models/dna_r10.4.1_e8.2_400bps_sup@v5.2.0_5mCG_5hmCG@v1"
models_directory: "data/dorado_models"
split_number: 100
process_subset_chunks: 3
seq_kit : "SQK-ULK114"

herro_model : bin/herro-v1

gpu_queues: "gpu_srv010,gpu_srv028"

# Preprocessing settings
min_length :
  default: 10000
  UL: 80000
min_mean_q : 9
genome_length : 3200000000

# Assembly settings
verkko_dryrun : False

# Hifiasm settings:
hifiasm : bin/hifiasm-0.25.0/hifiasm
hifiasm_opts:
  ont:   "--telo-m CCCTTA --dual-scaf --ul-cut 70000 -l1 --ont {ul}"
  herro: "--telo-m CCCTTA --dual-scaf --ul-cut 70000 -l1 {hq}"
  ont_trio: "--telo-m CCCTTA --dual-scaf --ul-cut 70000 -l0 --trio-dual --ont -1 {maternal} -2 {paternal} {ul}"
  herro_trio: "--telo-m CCCTTA --dual-scaf --ul-cut 70000 -l0 --trio-dual -1 {maternal} -2 {paternal} {hq}"
  ont_porec: "--telo-m CCCTTA --dual-scaf --ul-cut 70000 -l2 --ont --h1 {porec_r1} --h2 {porec_r2} {ul}"
  rfhap: "--telo-m CCCTTA --dual-scaf --primary --ul-cut 70000 -l2 --n-hap 1 --ont {ul}"

yak : bin/yak/yak
mashmap : bin/MashMap/build/bin/mashmap

# Variant calling settings
X_PAR_file: bin/dipcall.kit/hs38.PAR.bed
run-dipcall: bin/dipcall.kit/run-dipcall
hapdiff: bin/hapdiff/hapdiff.py

# meryl kmer choice
