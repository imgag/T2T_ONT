# ===================================================================
# 3D Chromatin Structure Prediction Configuration
# ===================================================================
# Tools: ASHIC, LorDG, HiC-GNN, ParticleChromo3D, TADbit
# Output: analysis_other/3dstructure/{asm}/{chr}/{roi}/{res}/{tool}/{hp}/

# Tool paths
ashic: bin/ASHIC/ashic/__main__.py
ashic_data: bin/ASHIC/ashic/cli/ashic_data.py
ashic_utils: bin/ASHIC/ashic/cli/ashic_utils.py
ashic_model: ASHIC-ZIPM
lordg_jar: bin/LorDG-1.0/LorDG_complete.jar
hicgnn_docker: oluwadarelab/hicgnn:latest
hicgnn_path: bin/HiC-GNN
particlechromo3d_path: bin/ParticleChromo3D/src/Ps.py

# ROI configuration: chromosome -> list of ROI -> list of resolutions
# Use "complete" for full chromosome
structure3d_roi:
  - "chr11":
    - "1000000-3000000" : [50000, 100000, 250000]
  - "chrX":
    - "complete" : [250000, 500000, 1000000]
    - "66919518-77620517" : [50000]

# Default resolution when auto-selecting
structure3d_default_resolution: 100000

# LorDG specific settings
lordg_num_models: 1
lordg_learning_rate: 0.1
lordg_max_iteration: 10000

#number of structures will be generated
# HiC-GNN specific settings
hicgnn_conversions: "[.1,.1,2]"
hicgnn_epochs: 10
hicgnn_learning_rate: 0.001

# ParticleChromo3D specific settings (Particle Swarm Optimization)
particlechromo3d_swarm_size: 15
particlechromo3d_iterations: 30000
particlechromo3d_threshold: 0.000001
particlechromo3d_loss_function: 2   # 0=SSE, 1=MSE, 2=RMSE, 3=Huber

# Legacy ASHIC ROIs (for backward compatibility with dip3d.smk)
ashic_resolution: 100000
ashic_rois:
  - "chr11:1000000-3000000"   
  - "chrX:66919518-77620517"

# ===================================================================
# Pore C Analysis
# ===================================================================

# Pairtools
parse2_depth: 20

# Juicer Resolutions
juicer_resolutions: "5000,10000,25000,40000,100000,250000,1000000"

# Cooler Resolutions
min_bin_width: 1000
cooler_resolutions: "1000,5000,10000,50000,100000"

# Cooltools
gc_track: "/mnt/storage3b/projects/no_ngsd/ahthapp1_T2T_ONT/sarah/data/gc.100000.tsv"
insulation_resolutions:
  - "25000"
  - "40000"

# FAN-C
regions_fanc:
  - "11_1500000-3500000"
  - "6_144000000-146000000"
  - "14_94000000-96000000"
  - "15_22000000-24000000"
  - "20_59000000-61000000"

# HiCExplorer
correction_method: "ICE"
filter_threshold: "-2.5 5"
correlation_range: "20000:500000"
porec_resolutions:
  - "1000"
  - "5000"
  - "10000"
  - "25000"
  - "40000"

# TAD calling parameters
tad_resolutions: ["25000", "40000"]  # Higher resolution for TADs
tad_min_depth: 20000
tad_max_depth: 200000
tad_step: 10000
tad_fdr_threshold: 0.05
tad_delta: 0.01
tad_correction_threshold: 1.5

# Loop calling parameters
loop_resolutions: ["5000", "10000"]  # Higher resolution for loops
loop_window_size: 10
loop_peak_width: 6
loop_max_distance: 2000000
loop_pvalue_threshold: 0.05
loop_fdr_threshold: 0.1

# Visualization parameters
plot_dpi: 300
aggregate_range: 100000
aggregate_bins: 30

# Insulation resolutions
insulation_resolutions:
  - "25000"
  - "40000"
insu_window_multipliers: [3,5,10,25]

# ===================================================================
# ANCESTRY ANALYSIS CONFIGURATION
# ===================================================================

# 10000G phased ref files (Lalli et al 2025)
1000G_phased_ref_vcf: data/ref/variant_sets/1000G_lalli/1KGP.CHM13v2.0.whole_genome.recalibrated.snp_indel.pass.phased.native_maps.2504.bcf.gz
