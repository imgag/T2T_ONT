# Reference datasets
ref: ../ahthapp1_T2T_ONT/data/ref/T2T-CHM13.v2.fasta
ref_cdna: ../ahthapp1_T2T_ONT/data/ref/Homo_sapiens.GRCh38.cdna.all.fa.gz
ref_cdna_paf: ../ahthapp1_T2T_ONT/data/ref/T2T-CHM13.cdna.paf
ref_giab_vcf: ../ahthapp1_T2T_ONT/data/ref/CHM13v2.0_HG2-T2TQ100-V1.1.vcf.gz
ref_hg002_q100: ../ahthapp1_T2T_ONT/data/ref/hg002v1.1.fasta.gz
ref_centromer_bed: ../ahthapp1_T2T_ONT/data/ref/hg002v1.1.cenSatv2.0.bed

# DORADO settings
dorado : bin/dorado-2.1.2-linux-x64/bin/dorado
dorado_model:
  sup: "data/dorado_models/dna_r10.4.1_e8.2_400bps_sup@v5.2.0"
  apk: "data/dorado_models/dna_r10.4.1_e8.2_apk_sup@v5.0.0"
  duplex: "sup"
  mod: "data/dorado_models/dna_r10.4.1_e8.2_400bps_sup@v5.2.0_5mCG_5hmCG@v2"
models_directory: "data/dorado_models"
split_number: 100
process_subset_chunks: 3
seq_kit : "SQK-ULK114"

herro_model : ../ahthapp1_T2T_ONT/bin/herro-v1.1

gpu_queues: "gpu_srv010,gpu_srv028,gpu_srv019"

# Hardcode which GPU device basecalling/error-correction use, bypassing
# automatic GPUtil-based selection. Only cuda:1 is currently usable on
# srv010 when running with the local executor (not cluster-sync). Set to
# null to go back to automatic selection (needed for cluster-sync dispatch
# across gpu_queues).
gpu_local_override: 1

# Preprocessing settings
min_length : 
  default: 10000
  UL: 80000
min_mean_q : 9
genome_length : 3200000000

# Assembly settings
verkko_dryrun : False

# Hifiasm settings:
hifiasm : ../ahthapp1_T2T_ONT/bin/hifiasm-0.25.0/hifiasm
hifiasm_opts:
  ont:   "--telo-m CCCTTA --dual-scaf --ul-cut 70000 -l1 --ont {ul}"
  ont_noscaff_primary:   "--telo-m CCCTTA --primary --ul-cut 70000 -l0 --ont {ul}"
  ont_noscaff:   "--telo-m CCCTTA --ul-cut 70000 -l1 --ont {ul}"
  herro: "--telo-m CCCTTA --dual-scaf --ul-cut 70000 -l1 {hq}"
  ont_trio: "--telo-m CCCTTA --dual-scaf --ul-cut 70000 -l0 --trio-dual --ont -1 {maternal} -2 {paternal} {ul}"
  herro_trio: "--telo-m CCCTTA --dual-scaf --ul-cut 70000 -l0 --trio-dual -1 {maternal} -2 {paternal} {hq}"
  rfhap: "--telo-m CCCTTA --dual-scaf --primary --ul-cut 70000 -l2 --n-hap 1 --ont {ul}"

yak : ../ahthapp1_T2T_ONT/bin/yak/yak
mashmap : ../ahthapp1_T2T_ONT/bin/MashMap/build/bin/mashmap

# Variant calling settings
X_PAR_file: ../ahthapp1_T2T_ONT/bin/dipcall.kit/hs38.PAR.bed
run-dipcall: ../ahthapp1_T2T_ONT/bin/dipcall.kit/run-dipcall
hapdiff: ../ahthapp1_T2T_ONT/bin/hapdiff/hapdiff.py

# meryl kmer choice
K-mer: 37  # For QC
K-mer_phasing: 30 # For Trio phasing

kmer_refs:
  GE-MED-T2T00: "analysis_other/merqury_shortread/DX203429_02.meryl"

# T2T contigs
T2T_chromosomes: ../ahthapp1_T2T_ONT/bin/T2T_Sequences/T2T_chromosomes.sh

# RepeatMasker
dfam_db: ../ahthapp1_T2T_ONT/data/ref/dfam39_full.7.h5

# Nextflow locations
nextflow: ../ahthapp1_T2T_ONT/bin/nextflow
wf_pore_c: ../ahthapp1_T2T_ONT/bin/wf-pore-c

# GQC
gqc:
  venv: ../ahthapp1_T2T_ONT/bin/GQC/venv
  config: ../ahthapp1_T2T_ONT/data/ref/gqc_config.yaml
  resourcedir: ../ahthapp1_T2T_ONT/data/ref/gqc_resources
  fastk_binfolder: ../ahthapp1_T2T_ONT/bin/FASTK/bin

# hmm_flagger
bam2cov: "mobinasri/flagger:v1.1.0 bam2cov"
hmm_flagger: "mobinasri/flagger:v1.1.0 hmm_flagger"
hmm_flagger_alpha_tsv: "../ahthapp1_T2T_ONT/data/ref/alpha_optimum_trunc_exp_gaussian_w_8000_n_50.ONT_R1041_Dorado_DEC_2024.v1.1.0.tsv"

# Methylation / haplotagging
modkit: ../ahthapp1_T2T_ONT/bin/dist_modkit_v0.5.1_8fa79e3/modkit
mod_num_reads: 100420
longphase: ../ahthapp1_T2T_ONT/bin/longphase_linux-x64

# Parent-of-origin (PatMat)
patmat: ../ahthapp1_T2T_ONT/bin/PatMat/patmat
patmat_dmr: ../ahthapp1_T2T_ONT/bin/PatMat/patmat/Imprinted_DMR_List_V1.LiftedOverToT2T-CHM13v2Hs1.tsv

# Dip3D
falign: ../ahthapp1_T2T_ONT/bin/Falign/Linux-amd64/../ahthapp1_T2T_ONT/bin/falign
dip3d: ../ahthapp1_T2T_ONT/bin/Falign/Linux-amd64/../ahthapp1_T2T_ONT/bin/dip3d
ashic: ../ahthapp1_T2T_ONT/bin/ASHIC/ashic/__main__.py
ashic_data: ../ahthapp1_T2T_ONT/bin/ASHIC/ashic/cli/ashic_data.py
ashic_utils: ../ahthapp1_T2T_ONT/bin/ASHIC/ashic/cli/ashic_utils.py 
ashic_model: ASHIC-ZIPM
ashic_resolution: 10000

# Cooler Resolutions  
cooler_resolutions: "1000,5000,10000,50000,100000"

# HiCExplorer
correction_method: "ICE"
filter_threshold: "-2.5 5"
correlation_range: "20000:500000"
porec_resolutions:
  - "1000"
  - "5000"
  - "10000"

# TAD calling parameters
tad_resolutions: ["25000", "40000"]  # Higher resolution for TADs
tad_min_depth: 20000
tad_max_depth: 200000
tad_step: 10000
tad_fdr_threshold: 0.05
tad_delta: 0.01
tad_correction_threshold: 1.5

# Loop calling parameters  
loop_resolutions: ["5000", "10000"]  # Higher resolution for loops
loop_window_size: 10
loop_peak_width: 6
loop_max_distance: 2000000
loop_pvalue_threshold: 0.05
loop_fdr_threshold: 0.1

# Visualization parameters
plot_dpi: 300
aggregate_range: 100000
aggregate_bins: 30

# Population genetics
liftover_chain_GRCh37_to_T2T: ../ahthapp1_T2T_ONT/data/ref/hg19-chm13v2.chain
