# Required parameters:
#   - dataset: name of dataset defined in `data/datasets.yml`
#   - HQ_method: Select one of:
#        - duplex: Looks for duplex files defined in dataset
#        - herro: Looks for herro files and creates them from simplex data if necessary
#        - combined: 

## Defaults if not specified:
#   

# Analysis matrix for testset chr19: 

# LR↓/UL→ |         50x         |      70x     |     90x      |
#         +---------------------+--------------+--------------+
#     15x |     duplex          |       --     |      --      |
#     20x |     duplex          |       --     |      --      |
#     25x |     duplex          |       --     |      --      |
#     35x | 15x DU + 20x herro  |       --     |      --      |  BOTH WITH AND WITHOUT POLISH
#     35x | duplex/herro        | duplex/herro | duplex/herro |  BITH WITH AND WITHOUT VERRKO POLISH
#     60x |     herro           |     herro    |    herro     |
#    120x |     herro           |     herro    |    herro     |

published_chr19_duplex15x:
  dataset: published
  HQ_method: duplex
  region: chr19
  cov_UL: 50
  cov_HQ: 15
  skip_verkko_polish: false

